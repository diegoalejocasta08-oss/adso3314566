<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showroom Koenigsegg - Modo Nocturno</title>
    
    <!-- Animaciones CSS externas -->
    <link rel="stylesheet" href="animate.css">
    <link rel="stylesheet" href="../04-estilos.css">

    <style>
        :root {
            --bg-color: #1a1c1e;
            --panel-bg: #2b2d31;
            --button-bg: #383a40;
            --accent-color: #ffd700;
            --text-color: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        /* --- MARCO MÓVIL DEL MOCKUP --- */
        .phone-container {
            width: 360px;
            background-color: var(--panel-bg);
            border-radius: 16px;
            border: 3px solid #404249;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.7);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
        }

        /* --- FILA SUPERIOR: LOGO Y MODO --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            background-color: #ffffff;
            padding: 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 45px;
        }

        .brand-logo img {
            height: 100%;
            width: auto;
        }

        .mode-badge {
            background-color: var(--button-bg);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #f1c40f;
        }

        /* --- NAVEGACIÓN MARCA --- */
        .brand-selector {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .nav-btn {
            background-color: var(--button-bg);
            border: none;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.75rem;
        }

        .brand-title {
            flex-grow: 1;
            background-color: var(--button-bg);
            text-align: center;
            padding: 10px;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 8px;
        }

        /* --- FILA ESPECIFICACIONES --- */
        .spec-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .spec-card {
            background-color: var(--button-bg);
            padding: 10px 5px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        /* --- SCENE Y ANIMACIÓN DEL VEHÍCULO --- */
        .stage {
            height: 220px;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(to bottom, #030814 0%, #0c1a30 70%, #111 100%);
            border: 1px solid #1a2332;
        }

        .moon {
            position: absolute;
            top: 20px;
            left: 70px;
            width: 30px;
            height: 30px;
            background: #e2e8f0;
            border-radius: 50%;
            box-shadow: 0 0 15px #e2e8f0;
        }

        .mountain {
            position: absolute;
            bottom: 40px;
            width: 100%;
            height: 80px;
            background: #091727;
            clip-path: polygon(0% 100%, 20% 40%, 45% 80%, 70% 20%, 100% 100%);
        }

        .road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40px;
            background: #111111;
            border-top: 2px solid #333333;
        }

        .road-line {
            position: absolute;
            top: 50%;
            width: 100%;
            height: 2px;
            background: repeating-linear-gradient(90deg, #f1c40f 0 15px, transparent 15px 30px);
        }

        .car {
            position: absolute;
            bottom: 8px;
            left: 50px;
            width: 170px;
            transition: left 0.1s linear, opacity 0.3s;
        }

        /* Estados del vehículo */
        .car-off { opacity: 0.3; }
        .car-engine-on { opacity: 1; filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.4)); }

        /* --- PANEL DE CONTROLES INFERIORES --- */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .ctrl-btn {
            background-color: var(--button-bg);
            border: none;
            color: #ffffff;
            padding: 10px 2px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.7rem;
            gap: 4px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .ctrl-btn:hover {
            background-color: #4a4d54;
        }

        .ctrl-btn:active {
            transform: scale(0.95);
        }

        .ctrl-btn.active {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <!-- Botón flotante para regresar a la zona principal -->
    <a href="../04-javascript/index.html" class="btn-home" title="Inicio">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="white" viewBox="0 0 256 256">
            <path d="M224,115.55V208a16,16,0,0,1-16,16H168a16,16,0,0,1-16-16V168a8,8,0,0,0-8-8H112a8,8,0,0,0-8,8v40a16,16,0,0,1-16,16H48a16,16,0,0,1-16-16V115.55a16,16,0,0,1,5.17-11.78l80-75.25a16,16,0,0,1,21.66,0l80,75.25A16,16,0,0,1,224,115.55Z"></path>
        </svg>
    </a>

    <!-- CONTENEDOR TIPO MÓVIL DEL MOCKUP -->
    <div class="phone-container animate__animated animate__fadeIn">
        
        <!-- Fila Encabezado -->
        <div class="top-bar">
            <div class="brand-logo">
                <img src="https://upload.wikimedia.org/wikipedia/en/thumb/e/e6/Koenigsegg_logo.svg/1200px-Koenigsegg_logo.svg.png" alt="Koenigsegg Logo">
            </div>
            <div class="mode-badge">
                🌙 Mode
            </div>
        </div>

        <!-- Navegación Marca -->
        <div class="brand-selector">
            <button class="nav-btn">
                <span>◀</span>
                <span>Prev</span>
            </button>
            <div class="brand-title">KOENIGSEGG</div>
            <button class="nav-btn">
                <span>▶</span>
                <span>Next</span>
            </button>
        </div>

        <!-- Especificaciones -->
        <div class="spec-grid">
            <div class="spec-card">
                <span>🏎️</span>
                <strong>JESKO</strong>
            </div>
            <div class="spec-card">
                <span>⚙️</span>
                <strong>Refer</strong>
            </div>
            <div class="spec-card">
                <span>🎨</span>
                <strong>BLANCO</strong>
            </div>
        </div>

        <!-- Escenario Interactivo -->
        <div class="stage">
            <div class="moon"></div>
            <div class="mountain"></div>
            <div class="road">
                <div class="road-line"></div>
            </div>
            <img id="car-element" class="car car-off" src="https://purepng.com/public/uploads/large/purepng.com-white-koenigsegg-agera-rs-carcarautomobilevehicletransportkoenigsegg-331527756778fll87.png" alt="Koenigsegg Jesko">
        </div>

        <!-- Controles de Movimiento (Bottom) -->
        <div class="controls-grid">
            <button id="btn-on" class="ctrl-btn">
                <span>⏁</span>
                <span>On</span>
            </button>
            <button id="btn-forw" class="ctrl-btn">
                <span>➔</span>
                <span>Forw</span>
            </button>
            <button id="btn-stop" class="ctrl-btn">
                <span>⏹</span>
                <span>Stop</span>
            </button>
            <button id="btn-back" class="ctrl-btn">
                <span>⬅</span>
                <span>Back</span>
            </button>
            <button id="btn-off" class="ctrl-btn">
                <span>⏻</span>
                <span>Off</span>
            </button>
        </div>

    </div>

    <script>
        // --- CLASE OBJETO: VEHICLE ---
        class Vehicle {
            constructor() {
                this.isEngineOn = false;
                this.positionX = 50; // Posición inicial en píxeles
                this.speed = 0; // Velocidad de movimiento
                this.maxRight = 160;
                this.maxLeft = 0;
            }

            turnOn() {
                this.isEngineOn = true;
            }

            turnOff() {
                this.isEngineOn = false;
                this.speed = 0;
            }

            moveForward() {
                if (this.isEngineOn) {
                    this.speed = 4;
                }
            }

            moveBackward() {
                if (this.isEngineOn) {
                    this.speed = -4;
                }
            }

            stop() {
                this.speed = 0;
            }

            updatePosition() {
                if (this.speed !== 0) {
                    this.positionX += this.speed;
                    // Límites de la carretera
                    if (this.positionX > this.maxRight) this.positionX = this.maxRight;
                    if (this.positionX < this.maxLeft) this.positionX = this.maxLeft;
                }
                return this.positionX;
            }
        }

        // --- CLASE OBJETO: UI CONTROLLER ---
        class ShowroomUI {
            constructor(vehicle) {
                this.car = vehicle;
                
                // Elementos DOM
                this.carEl = document.getElementById('car-element');
                this.btnOn = document.getElementById('btn-on');
                this.btnForw = document.getElementById('btn-forw');
                this.btnStop = document.getElementById('btn-stop');
                this.btnBack = document.getElementById('btn-back');
                this.btnOff = document.getElementById('btn-off');

                this.loopId = null;
                this.initEvents();
                this.startAnimationLoop();
            }

            initEvents() {
                this.btnOn.addEventListener('click', () => this.handleOn());
                this.btnOff.addEventListener('click', () => this.handleOff());
                this.btnForw.addEventListener('click', () => this.handleForw());
                this.btnBack.addEventListener('click', () => this.handleBack());
                this.btnStop.addEventListener('click', () => this.handleStop());
            }

            handleOn() {
                this.car.turnOn();
                this.carEl.className = 'car car-engine-on animate__animated animate__pulse';
            }

            handleOff() {
                this.car.turnOff();
                this.carEl.className = 'car car-off';
            }

            handleForw() {
                if (this.car.isEngineOn) {
                    this.car.moveForward();
                }
            }

            handleBack() {
                if (this.car.isEngineOn) {
                    this.car.moveBackward();
                }
            }

            handleStop() {
                this.car.stop();
            }

            startAnimationLoop() {
                const animate = () => {
                    const newPos = this.car.updatePosition();
                    this.carEl.style.left = `${newPos}px`;
                    this.loopId = requestAnimationFrame(animate);
                };
                animate();
            }
        }

        // --- INSTANCIACIÓN POO ---
        const jeskoVehicle = new Vehicle();
        const appUI = new ShowroomUI(jeskoVehicle);
    </script>
</body>
</html>
